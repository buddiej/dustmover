[platformio]
src_dir = firmware/DustMover
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 230400
build_flags = -Wall -Wextra
lib_ldf_mode = chain+

[env:esp32dev_sd]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DDUSTMOVER_USE_SD=1
